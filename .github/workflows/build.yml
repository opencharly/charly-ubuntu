name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'charly release CalVer to package (e.g. 2026.227.1026)'
        required: true
      charly_lib_version:
        description: 'charly-lib release TAG (pinned) to fetch the shared host from'
        required: true
        default: 'v2026.256.1131'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download charly release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin plugins
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-linux-*' --dir bin
          for f in bin/charly-linux-*; do
            mv "$f" "bin/charly-${f#bin/charly-linux-}"
          done
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-candy-charly.yml' --dir .
          # The welded plugins no longer ship as per-plugin binaries: the shared
          # charly-lib host serves them all (opencharly/sdk#258 packagekit hard
          # cutover). Its host + .providers manifests are fetched next.

      - name: Download the charly-lib shared plugin host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p plugins/amd64 plugins/arm64 .charly-lib
          gh release download "${{ inputs.charly_lib_version }}" --repo opencharly/charly-lib \
            --pattern 'charly-lib-linux-amd64' \
            --pattern 'charly-lib-linux-arm64' \
            --pattern '*.providers' --dir .charly-lib --clobber
          for arch in amd64 arm64; do
            # The host binary (downloaded non-executable) + one plugin-<word>
            # symlink per welded plugin + its .providers manifest — the ONE
            # layout packagekit accepts.
            install -m0755 ".charly-lib/charly-lib-linux-$arch" "plugins/$arch/charly-lib"
            for f in .charly-lib/*.providers; do
              n=$(basename "$f" .providers)
              cp "$f" "plugins/$arch/$n.providers"
              ln -sf charly-lib "plugins/$arch/$n"
            done
          done

      - name: Install charly + baked generate-packages plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo install -Dm755 bin/charly-amd64 /usr/local/bin/charly
          sudo mkdir -p /usr/lib/charly/plugins
          # Shared host once + plugin-<word> symlinks (the loader contract is
          # unchanged: a .providers manifest beside an executable named plugin-<word>).
          sudo install -Dm755 plugins/amd64/charly-lib /usr/lib/charly/plugins/charly-lib
          for f in plugins/amd64/*.providers; do
            n=$(basename "$f" .providers)
            sudo install -Dm644 "$f" "/usr/lib/charly/plugins/$n.providers"
            sudo ln -sf charly-lib "/usr/lib/charly/plugins/$n"
          done
          mkdir -p /tmp/plugin
          gh release download --repo opencharly/plugin-generate-packages \
            --pattern 'generate-packages-linux-amd64' \
            --pattern 'generate-packages.providers' --dir /tmp/plugin
          sudo install -Dm755 /tmp/plugin/generate-packages-linux-amd64 /usr/lib/charly/plugins/generate-packages
          sudo install -Dm644 /tmp/plugin/generate-packages.providers /usr/lib/charly/plugins/generate-packages.providers
          charly version

      - name: Write the GPG signing key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" > key.gpg
          chmod 600 key.gpg

      - name: Build packages
        env:
          CHARLY_PROJECT_DIR: ${{ github.workspace }}
          NFPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for variant in default full minimal; do
            for arch in amd64 arm64; do
              charly generate-packages \
                --candy charly-candy-charly.yml \
                --binary bin/charly-$arch \
                --plugins plugins/$arch \
                --version ${{ inputs.version }} \
                --arch $arch \
                --variant $variant \
                --formats deb \
                --out pool/main/c/charly \
                --signing-key key.gpg
            done
          done

      - name: Assemble + sign the apt repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # The awk filter uses single quotes, which would terminate a
          # bash -c '...' argument — feed the script via a quoted heredoc
          # so the container's bash receives it verbatim.
          # -i is required: without it docker does not attach stdin, so the
          # heredoc body never reaches the container's bash and the step
          # "passes" while doing nothing.
          docker run --rm -i -v "${{ github.workspace }}:/ws:rw" \
            -e GPG_PASSPHRASE="${{ secrets.GPG_PASSPHRASE }}" \
            ubuntu:24.04 bash <<'EOF'
            set -e
            # The base image ships neither gpg nor apt-ftparchive (they live in
            # gnupg/apt-utils) — install them before assembling the repo.
            apt-get update && apt-get install -y --no-install-recommends gnupg apt-utils
            export GNUPGHOME=/tmp/gnupg
            mkdir -p $GNUPGHOME && chmod 700 $GNUPGHOME
            gpg --batch --import /ws/key.gpg
            cd /ws
            for arch in amd64 arm64; do
              mkdir -p dists/stable/main/binary-$arch
              # apt-ftparchive packages indexes the WHOLE pool; filter to the
              # arch so binary-<arch>/Packages contains only that arch's debs.
              # The pool path MUST be relative (cwd=/ws): an absolute path
              # makes apt-ftparchive emit an absolute Filename, which apt then
              # prepends the file:// base to, doubling it (/ws//ws/pool/...).
              apt-ftparchive packages pool | awk -v want="$arch" '
                BEGIN { RS = ""; FS = "\n" }
                { for (i = 1; i <= NF; i++) if ($i ~ /^Architecture: /) a = substr($i, 15)
                  if (a == want) print $0 "\n" }
              ' > dists/stable/main/binary-$arch/Packages
              gzip -k dists/stable/main/binary-$arch/Packages
            done
            # Suite/Codename are required or apt warns "Conflicting distribution".
            apt-ftparchive -o APT::FTPArchive::Release::Origin=charly \
              -o APT::FTPArchive::Release::Suite=stable \
              -o APT::FTPArchive::Release::Codename=stable \
              release dists/stable > dists/stable/Release
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-file <(echo "$GPG_PASSPHRASE") \
              --clearsign -o /ws/dists/stable/InRelease /ws/dists/stable/Release
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-file <(echo "$GPG_PASSPHRASE") \
              -abs -o /ws/dists/stable/Release.gpg /ws/dists/stable/Release
          EOF

      - name: Create stable copies
        run: |
          for arch in amd64 arm64; do
            newest=$(ls pool/main/c/charly/charly_*_$arch.deb | grep -v minimal | grep -v full | sort -V | tail -1)
            cp "$newest" pool/main/c/charly/charly-$arch.deb
          done

      - name: Install-test
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm -e VERSION="$VERSION" -v "${{ github.workspace }}:/ws:ro" ubuntu:24.04 bash -c '
            set -e
            echo "deb [signed-by=/ws/charly.gpg] file:///ws stable main" > /etc/apt/sources.list.d/charly.list
            apt-get update
            apt-get install -y charly
            # charly v2026.250.0854+ ships systemd units + /etc/charly config
            test -f /usr/lib/systemd/system/charly-mcp.service && test -f /usr/lib/systemd/user/charly-mcp.service || { echo "packaged charly-mcp units missing"; exit 1; }
            # non-autostarting: no post-install enable — is-enabled must be
            # 'disabled', or the no-systemd-manager error in the container
            if command -v systemctl >/dev/null 2>&1; then
              state=$(systemctl is-enabled charly-mcp 2>/dev/null || true)
              case "$state" in
                ""|disabled) ;;
                *) echo "charly-mcp unexpectedly enabled: $state"; exit 1 ;;
              esac
            else
              grep -q '^WantedBy=' /usr/lib/systemd/system/charly-mcp.service || { echo "system unit lacks WantedBy="; exit 1; }
            fi
            # ...and no enable marker (wants symlink) exists
            test ! -e /etc/systemd/system/multi-user.target.wants/charly-mcp.service || { echo "unexpected enable marker present"; exit 1; }
            # the shipped system-wide config validates
            test -f /etc/charly/charly.yml || { echo "/etc/charly/charly.yml missing"; exit 1; }
            charly box validate -C /etc/charly >/dev/null || { echo "box validate failed"; exit 1; }
            # the MCP server starts on demand (no systemd in the container: run
            # it in the foreground and require it to stay up until the timeout)
            (cd /etc/charly && timeout 5 charly mcp serve --listen 127.0.0.1:18765 >/dev/null 2>&1) || serve=$?
            test "$serve" -eq 124 || { echo "charly mcp serve exited $serve (expected 124 = ran until timeout)"; exit 1; }
            # The cutover real risk: the SHARED HOST must serve the welded
            # set through the plugin-<word> symlink + .providers contract. Assert
            # EVERY installed plugin is a symlink to charly-lib AND the host
            # serves it (the go-plugin handshake).
            test -x /usr/lib/charly/plugins/charly-lib || { echo "charly-lib shared host missing"; exit 1; }
            ls -l /usr/lib/charly/plugins
            _n=0
            for _m in /usr/lib/charly/plugins/*.providers; do
              _w=$(basename "$_m" .providers)
              test -L "/usr/lib/charly/plugins/$_w" || { echo "$_w: plugin symlink missing"; exit 1; }
              test "$(readlink "/usr/lib/charly/plugins/$_w")" = "charly-lib" || { echo "$_w: symlink does not target charly-lib"; exit 1; }
              _fifo=/tmp/_hs.$$
              mkfifo "$_fifo"
              CHARLY_PLUGIN=charly-plugin-v1 "/usr/lib/charly/plugins/$_w" >"$_fifo" 2>/dev/null &
              _p=$!
              IFS= read -r -t 3 _h < "$_fifo" || _h=
              kill "$_p" 2>/dev/null
              rm -f "$_fifo"
              case "$_h" in *grpc*) ;; *) echo "$_w: shared host did not serve (got $_h)"; exit 1 ;; esac
              _n=$((_n + 1))
            done
            test "$_n" -ge 1 || { echo "no plugin manifests installed"; exit 1; }
            echo "shared-host serves all $_n welded plugins"
          '

      - name: Remove the signing key + build artifacts before deploy
        run: |
          # The upload path is . (the apt repo root IS the workspace root), so
          # the downloaded binaries, plugin tarballs, and extracted plugins must
          # be removed or the Pages artifact exceeds the 1 GB limit.
          rm -f key.gpg charly-candy-charly.yml
          rm -rf bin plugins .charly-lib

      - name: Deploy to Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        uses: actions/deploy-pages@v4
