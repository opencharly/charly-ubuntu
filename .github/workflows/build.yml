name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'charly release CalVer to package (e.g. 2026.227.1026)'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download charly release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin plugins
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-linux-*' --dir bin
          for f in bin/charly-linux-*; do
            mv "$f" "bin/charly-${f#bin/charly-linux-}"
          done
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-plugins-linux-*.tar.gz' --dir .
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-candy-charly.yml' --dir .
          for arch in amd64 arm64; do
            mkdir -p plugins/$arch
            tar -xzf charly-plugins-linux-$arch.tar.gz -C plugins/$arch
          done

      - name: Install charly + baked generate-packages plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo install -Dm755 bin/charly-amd64 /usr/local/bin/charly
          sudo mkdir -p /usr/lib/charly/plugins
          sudo install -Dm644 plugins/amd64/*.providers /usr/lib/charly/plugins/
          sudo install -Dm755 plugins/amd64/plugin-* /usr/lib/charly/plugins/
          mkdir -p /tmp/plugin
          gh release download --repo opencharly/plugin-generate-packages \
            --pattern 'generate-packages-linux-amd64' \
            --pattern 'generate-packages.providers' --dir /tmp/plugin
          sudo install -Dm755 /tmp/plugin/generate-packages-linux-amd64 /usr/lib/charly/plugins/generate-packages
          sudo install -Dm644 /tmp/plugin/generate-packages.providers /usr/lib/charly/plugins/generate-packages.providers
          charly version

      - name: Write the GPG signing key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" > key.gpg
          chmod 600 key.gpg

      - name: Build packages
        env:
          CHARLY_PROJECT_DIR: ${{ github.workspace }}
          NFPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for variant in default full minimal; do
            for arch in amd64 arm64; do
              charly generate-packages \
                --candy charly-candy-charly.yml \
                --binary bin/charly-$arch \
                --plugins plugins/$arch \
                --version ${{ inputs.version }} \
                --arch $arch \
                --variant $variant \
                --formats deb \
                --out pool/main/c/charly \
                --signing-key key.gpg
            done
          done

      - name: Assemble + sign the apt repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # The awk filter uses single quotes, which would terminate a
          # bash -c '...' argument — feed the script via a quoted heredoc
          # so the container's bash receives it verbatim.
          # -i is required: without it docker does not attach stdin, so the
          # heredoc body never reaches the container's bash and the step
          # "passes" while doing nothing.
          docker run --rm -i -v "${{ github.workspace }}:/ws:rw" \
            -e GPG_PASSPHRASE="${{ secrets.GPG_PASSPHRASE }}" \
            ubuntu:24.04 bash <<'EOF'
            set -e
            # The base image ships neither gpg nor apt-ftparchive (they live in
            # gnupg/apt-utils) — install them before assembling the repo.
            apt-get update && apt-get install -y --no-install-recommends gnupg apt-utils
            export GNUPGHOME=/tmp/gnupg
            mkdir -p $GNUPGHOME && chmod 700 $GNUPGHOME
            gpg --batch --import /ws/key.gpg
            cd /ws
            for arch in amd64 arm64; do
              mkdir -p dists/stable/main/binary-$arch
              # apt-ftparchive packages indexes the WHOLE pool; filter to the
              # arch so binary-<arch>/Packages contains only that arch's debs.
              # The pool path MUST be relative (cwd=/ws): an absolute path
              # makes apt-ftparchive emit an absolute Filename, which apt then
              # prepends the file:// base to, doubling it (/ws//ws/pool/...).
              apt-ftparchive packages pool | awk -v want="$arch" '
                BEGIN { RS = ""; FS = "\n" }
                { for (i = 1; i <= NF; i++) if ($i ~ /^Architecture: /) a = substr($i, 15)
                  if (a == want) print $0 "\n" }
              ' > dists/stable/main/binary-$arch/Packages
              gzip -k dists/stable/main/binary-$arch/Packages
            done
            # Suite/Codename are required or apt warns "Conflicting distribution".
            apt-ftparchive -o APT::FTPArchive::Release::Origin=charly \
              -o APT::FTPArchive::Release::Suite=stable \
              -o APT::FTPArchive::Release::Codename=stable \
              release dists/stable > dists/stable/Release
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-file <(echo "$GPG_PASSPHRASE") \
              --clearsign -o /ws/dists/stable/InRelease /ws/dists/stable/Release
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-file <(echo "$GPG_PASSPHRASE") \
              -abs -o /ws/dists/stable/Release.gpg /ws/dists/stable/Release
          EOF

      - name: Create stable copies
        run: |
          for arch in amd64 arm64; do
            newest=$(ls pool/main/c/charly/charly_*_$arch.deb | grep -v minimal | grep -v full | sort -V | tail -1)
            cp "$newest" pool/main/c/charly/charly-$arch.deb
          done

      - name: Install-test
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm -e VERSION="$VERSION" -v "${{ github.workspace }}:/ws:ro" ubuntu:24.04 bash -c '
            set -e
            echo "deb [signed-by=/ws/charly.gpg] file:///ws stable main" > /etc/apt/sources.list.d/charly.list
            apt-get update
            apt-get install -y charly
            test "$(charly version)" = "$VERSION" || { echo "version mismatch: $(charly version) != $VERSION"; exit 1; }
            cd /tmp && charly doctor
          '

      - name: Remove the signing key + build artifacts before deploy
        run: |
          # The upload path is . (the apt repo root IS the workspace root), so
          # the downloaded binaries, plugin tarballs, and extracted plugins must
          # be removed or the Pages artifact exceeds the 1 GB limit.
          rm -f key.gpg charly-plugins-linux-*.tar.gz charly-candy-charly.yml
          rm -rf bin plugins

      - name: Deploy to Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        uses: actions/deploy-pages@v4
